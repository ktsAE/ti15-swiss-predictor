# Keeps the bracket current during the event. The push is what makes Netlify
# rebuild, so this one job closes the whole loop: result played -> live site,
# with nobody's laptop needing to be awake.
name: Update results

on:
  schedule:
    # This is a *starter*, not a ticker. GitHub runs scheduled workflows on a
    # best-effort basis and drops most of them under load: asking for every
    # ten minutes actually produced runs 40-160 minutes apart, which is not
    # something a cron expression can fix.
    #
    # So the schedule only has to land occasionally, and the job below does
    # its own polling once started. Actions minutes are free and unlimited on
    # public repos, so a job that sits and waits costs nothing.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One at a time. A run that fires while another is polling waits its turn and
# takes over when that one ends, which chains coverage rather than racing for
# the same commit.
concurrency:
  group: update-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll for results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Just under the job timeout, so the next queued run picks up cleanly.
          stop=$(( $(date +%s) + 48 * 60 ))

          while :; do
            # A source blip must cost one cycle, not the whole run.
            node update-results.mjs || echo "updater failed this cycle, carrying on"

            if ! git diff --quiet -- index.html; then
              # Netlify runs this on every deploy. Checking here means a result
              # that somehow breaks the build never reaches the site.
              if node build.mjs > /dev/null; then
                # Scoped to index.html on purpose: this runs unattended against
                # a public repo, and `commit -a` would publish anything else
                # that happened to be modified in the tree.
                git commit -q -m "Results from Valve/OpenDota" -- index.html
                echo "committed a result"
              else
                echo "that result breaks the build - reverting, not committing"
                git checkout -- index.html
              fi
            fi

            # Retries a push that failed earlier rather than stranding the
            # commit here until the job ends.
            if [ -n "$(git log --oneline origin/main..HEAD)" ]; then
              if git push -q; then echo "pushed"; else echo "push failed, retrying next cycle"; fi
            fi

            [ "$(date +%s)" -ge "$stop" ] && break
            sleep 300
          done
